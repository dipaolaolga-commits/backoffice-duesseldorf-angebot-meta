<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background with subtle gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  
  <!-- Document/File Icon - Professional -->
  <g transform="translate(16, 18)">
    <!-- Document shape -->
    <path d="M4 2h16l6 6v20H4V2z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- Folded corner -->
    <path d="M20 2v6h6" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <!-- Lines representing text -->
    <line x1="8" y1="12" x2="18" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="8" y1="16" x2="16" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="8" y1="20" x2="14" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <!-- Checkmark badge -->
  <circle cx="48" cy="18" r="7" fill="#10b981" opacity="0.95"/>
  <path d="M45.5 18l1.5 1.5 3.5-3.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
